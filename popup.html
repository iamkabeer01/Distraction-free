<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Distraction Free</title>
<style>
  body { font-family: system-ui, sans-serif; width: 360px; padding: 12px; }
  h3 { margin: 0 0 8px; }
  section { margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 4px; border-bottom: 1px solid #eee; }
  td.site { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tbody { display: block; max-height: 200px; overflow-y: auto; }
  thead tr, tbody tr { display: table; width: 100%; table-layout: fixed; }
  .verdict-allow { color: #2e7d32; font-weight: 600; }
  .verdict-block { color: #c62828; font-weight: 600; }
  .verdict-error { color: #ef6c00; font-weight: 600; cursor: help; }
  .pending { color: #777; }
  .stat { font-size: 12px; color: #555; margin-top: 8px; }
  details summary { cursor: pointer; font-size: 12px; color: #666; margin-top: 4px; }
  label { display: block; margin-top: 8px; font-size: 12px; color: #333; }
  input { width: 100%; padding: 5px 7px; margin-top: 3px; box-sizing: border-box; font-size: 12px; }
  button { margin-top: 8px; padding: 6px 14px; cursor: pointer; font-size: 12px; }
  #status { margin-top: 6px; font-size: 11px; }
</style>
</head>
<body>
  <h3>Distraction Free</h3>

  <section>
    <table>
      <thead>
        <tr><th>Site</th><th>Open</th><th>Status</th></tr>
      </thead>
      <tbody id="tabList"></tbody>
    </table>
    <div class="stat">Distracted tabs closed: <strong id="distractedCount">0</strong></div>
  </section>

  <details>
    <summary>Settings</summary>
    <label>Gemini API key
      <input type="password" id="apiKey" placeholder="AIza...">
    </label>
    <label>Gemini model
      <input type="text" id="model" placeholder="gemini-3.6-flash">
    </label>
    <label>Check after (minutes)
      <input type="number" id="checkMinutes" min="1" step="1" placeholder="2">
    </label>
    <button id="save">Save</button>
    <div id="status"></div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
